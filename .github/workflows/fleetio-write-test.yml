name: fleetio-write-test
on:
  workflow_dispatch:
jobs:
  wtest:
    runs-on: ubuntu-latest
    steps:
      - name: Fleetio resolve FINAL confirm (self-cleaning)
        env:
          FKEY: ${{ secrets.FLEETIO_API_KEY }}
          FACC: ${{ secrets.FLEETIO_ACCOUNT_TOKEN }}
        run: |
          set +e
          V1="https://secure.fleetio.com/api/v1"
          NEW="https://secure.fleetio.com/api"
          H=(-H "Authorization: Token $FKEY" -H "Account-Token: $FACC" -H "Accept: application/json")
          JH=(-H "Content-Type: application/json")
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          VID=$(curl -s "${H[@]}" "$V1/issues?per_page=1" | jq -r 'if type=="array" then .[0].vehicle_id else .records[0].vehicle_id end')
          IID=$(curl -s "${H[@]}" "${JH[@]}" -X POST "$V1/issues" -d "{\"vehicle_id\":$VID,\"summary\":\"ZZ RESOLVE FINAL\",\"reported_at\":\"$NOW\"}" | jq -r '.id')
          echo "test issue=$IID"
          echo "== PUT resolve WITH note =="
          curl -s "${H[@]}" -H "X-Api-Version: 2025-05-05" "${JH[@]}" -X PUT "$NEW/issues/$IID/resolve" \
            -d '{"note":"ZZ resolved via dashboard test - safe to ignore"}' -o r.json -w "   code %{http_code}\n"
          echo "   resp head: $(head -c 260 r.json)"
          echo "   state now: $(curl -s "${H[@]}" "$V1/issues/$IID" | jq -r '.state')"
          echo "== CLEANUP delete =="
          curl -s "${H[@]}" -X DELETE "$V1/issues/$IID" -o /dev/null -w "   delete %{http_code}\n"
          echo "== done =="
