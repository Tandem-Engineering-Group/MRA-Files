name: fleetio-write-test
on:
  workflow_dispatch:
jobs:
  wtest:
    runs-on: ubuntu-latest
    steps:
      - name: Fleetio resolve probe v6 - new API base (self-cleaning)
        env:
          FKEY: ${{ secrets.FLEETIO_API_KEY }}
          FACC: ${{ secrets.FLEETIO_ACCOUNT_TOKEN }}
        run: |
          set +e
          V1="https://secure.fleetio.com/api/v1"
          NEW="https://secure.fleetio.com/api"
          H=(-H "Authorization: Token $FKEY" -H "Account-Token: $FACC" -H "Accept: application/json")
          JH=(-H "Content-Type: application/json")
          VER=(-H "X-Api-Version: 2024-03-15")
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          VID=$(curl -s "${H[@]}" "$V1/issues?per_page=1" | jq -r 'if type=="array" then .[0].vehicle_id else .records[0].vehicle_id end')
          IID=$(curl -s "${H[@]}" "${JH[@]}" -X POST "$V1/issues" -d "{\"vehicle_id\":$VID,\"summary\":\"ZZ RESOLVE TEST6\",\"reported_at\":\"$NOW\"}" | jq -r '.id')
          echo "issue=$IID"
          echo "E) GET new base /api/issues/{id} + version:"
          curl -s "${H[@]}" "${VER[@]}" "$NEW/issues/$IID" -o e.json -w "   E code %{http_code}\n"; echo "   $(head -c 120 e.json)"
          echo "F) PUT new base /api/issues/{id}/resolve + version:"
          curl -s "${H[@]}" "${VER[@]}" "${JH[@]}" -X PUT "$NEW/issues/$IID/resolve" -d '{}' -o f.json -w "   F code %{http_code}\n"; echo "   $(head -c 160 f.json)"
          echo "   state now (v1 GET): $(curl -s "${H[@]}" "$V1/issues/$IID" | jq -r '.state')"
          echo "G) PATCH new base /api/issues/{id} state_event=resolve:"
          curl -s "${H[@]}" "${VER[@]}" "${JH[@]}" -X PATCH "$NEW/issues/$IID" -d '{"state_event":"resolve"}' -o g.json -w "   G code %{http_code}\n"; echo "   $(head -c 120 g.json)"
          echo "   state now: $(curl -s "${H[@]}" "$V1/issues/$IID" | jq -r '.state')"
          curl -s "${H[@]}" -X DELETE "$V1/issues/$IID" -o /dev/null -w "   cleanup delete %{http_code}\n"
          echo "== done =="
