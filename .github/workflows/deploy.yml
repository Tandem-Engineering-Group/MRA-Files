name: Deploy to Azure Static Website

on:
  push:
    branches: [main]
    paths:
      - 'MRA_Dashboard.html'
      - 'data.js'
      - 'index.html'
      - 'preview.html'
      - 'MRA_Project_Intake_Template.xlsx'
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview = preview.html only; live = index.html + MRA_Dashboard.html; data = data.js only; sas = AzCopy token; cleanup = delete temp preview.html blob; listscand = build data.js FROM the Lists (validation only, no publish)'
        type: choice
        options:
          - preview
          - live
          - data
          - sas
          - cleanup
          - listscand
        default: preview

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # listscand: build a CANDIDATE data.js straight from the 4 SharePoint Lists (Graph app auth),
      # diff it against the live workbook-built data.js, and confirm item-ids (_id) are stamped.
      # Validation ONLY — uploads an artifact, never publishes. Proves the cutover read path works.
      - name: Build candidate data.js from the Lists (no publish)
        if: ${{ inputs.mode == 'listscand' }}
        shell: pwsh
        env:
          SP_TENANT_ID:     ${{ secrets.SP_TENANT_ID }}
          SP_CLIENT_ID:     ${{ secrets.SP_CLIENT_ID }}
          SP_CLIENT_SECRET: ${{ secrets.SP_CLIENT_SECRET }}
        run: |
          if (-not $env:SP_TENANT_ID -or -not $env:SP_CLIENT_ID -or -not $env:SP_CLIENT_SECRET) {
            Write-Error "Missing SP_TENANT_ID / SP_CLIENT_ID / SP_CLIENT_SECRET repo secrets — the Graph 'Lists Reader' app (IT/Part A) must be set up first."
            exit 1
          }
          ./Export-FromLists.ps1 -OutFile data.fromlists.js
          Write-Host "`n=== _id (SharePoint item id) presence ==="
          $c = Get-Content data.fromlists.js -Raw
          Write-Host ("_id occurrences in candidate: " + ([regex]::Matches($c,'\"_id\"')).Count)
          Write-Host "`n=== Compare candidate (Lists) vs live (workbook) ==="
          try { ./Compare-DataJs.ps1 data.js data.fromlists.js } catch { Write-Host "Compare-DataJs note: $($_.Exception.Message)" }

      - name: Upload candidate data.js artifact
        if: ${{ inputs.mode == 'listscand' }}
        uses: actions/upload-artifact@v4
        with:
          name: data-fromlists
          path: data.fromlists.js
          retention-days: 3

      # Generate a long-lived, write-scoped SAS for AzCopy on a no-admin PC.
      # Writes the full upload target URL to an artifact (masked in logs).
      - name: Generate AzCopy upload token
        if: ${{ inputs.mode == 'sas' }}
        run: |
            EXPIRY=$(date -u -d "+730 days" '+%Y-%m-%dT%H:%MZ')
            SAS=$(az storage container generate-sas \
              --account-name mrashopdash \
              --account-key "$AZURE_STORAGE_KEY" \
              --name '$web' \
              --permissions rcwl \
              --expiry "$EXPIRY" \
              -o tsv)
            echo "::add-mask::$SAS"
            mkdir -p out
            printf 'https://mrashopdash.blob.core.windows.net/$web/data.js?%s' "$SAS" > out/azure-target.txt
            echo "Generated azure-target.txt (token valid until $EXPIRY). Value is masked in logs."
        env:
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}

      - name: Upload token artifact
        if: ${{ inputs.mode == 'sas' }}
        uses: actions/upload-artifact@v4
        with:
          name: azure-target
          path: out/azure-target.txt
          retention-days: 1

      # Always safe: preview.html is a standalone file, separate from the live board.
      - name: Upload preview.html
        if: ${{ hashFiles('preview.html') != '' }}
        run: |
            az storage blob upload \
              --account-name mrashopdash \
              --container-name '$web' \
              --name 'preview.html' \
              --file preview.html \
              --content-type 'text/html' \
              --content-cache-control 'no-cache, must-revalidate' \
              --overwrite \
              --auth-mode key \
              --only-show-errors
        env:
          AZURE_STORAGE_ACCOUNT: mrashopdash
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}

      # Logo — uploaded whenever logo.png exists in the repo (it's a static asset).
      - name: Upload logo.png
        if: ${{ hashFiles('logo.png') != '' }}
        run: |
            az storage blob upload \
              --account-name mrashopdash \
              --container-name '$web' \
              --name 'logo.png' \
              --file logo.png \
              --content-type 'image/png' \
              --overwrite \
              --auth-mode key \
              --only-show-errors
        env:
          AZURE_STORAGE_ACCOUNT: mrashopdash
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}

      # Full logo (with tagline, light caption) for the footer.
      - name: Upload logo-full-dark.png
        if: ${{ hashFiles('logo-full-dark.png') != '' }}
        run: |
            az storage blob upload \
              --account-name mrashopdash \
              --container-name '$web' \
              --name 'logo-full-dark.png' \
              --file logo-full-dark.png \
              --content-type 'image/png' \
              --overwrite \
              --auth-mode key \
              --only-show-errors
        env:
          AZURE_STORAGE_ACCOUNT: mrashopdash
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}

      # Employee-of-the-Month photo (wall view). Swap monthly — replace eotm.png/.jpg.
      - name: Upload eotm.png
        if: ${{ hashFiles('eotm.png') != '' }}
        run: |
            az storage blob upload \
              --account-name mrashopdash \
              --container-name '$web' \
              --name 'eotm.png' \
              --file eotm.png \
              --content-type 'image/png' \
              --overwrite \
              --auth-mode key \
              --only-show-errors
        env:
          AZURE_STORAGE_ACCOUNT: mrashopdash
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
      - name: Upload eotm.jpg
        if: ${{ hashFiles('eotm.jpg') != '' }}
        run: |
            az storage blob upload \
              --account-name mrashopdash \
              --container-name '$web' \
              --name 'eotm.jpg' \
              --file eotm.jpg \
              --content-type 'image/jpeg' \
              --overwrite \
              --auth-mode key \
              --only-show-errors
        env:
          AZURE_STORAGE_ACCOUNT: mrashopdash
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}

      # Project intake template — static asset, uploaded whenever it exists in the repo.
      - name: Upload MRA_Project_Intake_Template.xlsx
        if: ${{ hashFiles('MRA_Project_Intake_Template.xlsx') != '' }}
        run: |
            az storage blob upload \
              --account-name mrashopdash \
              --container-name '$web' \
              --name 'MRA_Project_Intake_Template.xlsx' \
              --file MRA_Project_Intake_Template.xlsx \
              --content-type 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' \
              --overwrite \
              --auth-mode key \
              --only-show-errors
        env:
          AZURE_STORAGE_ACCOUNT: mrashopdash
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}

      # Cleanup — delete the temporary preview.html blob from the live site.
      - name: Delete preview.html
        if: ${{ inputs.mode == 'cleanup' }}
        run: |
            az storage blob delete \
              --account-name mrashopdash \
              --container-name '$web' \
              --name 'preview.html' \
              --auth-mode key \
              --only-show-errors
            echo "Deleted preview.html from the live site."
        env:
          AZURE_STORAGE_ACCOUNT: mrashopdash
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}

      # data.js only — for when the local Export-Data.ps1 can't push to Azure itself.
      # Uploads the repo's current data.js (replace it first, then dispatch mode=data).
      - name: Upload data.js
        if: ${{ inputs.mode == 'data' }}
        run: |
            az storage blob upload \
              --account-name mrashopdash \
              --container-name '$web' \
              --name 'data.js' \
              --file data.js \
              --content-type 'application/javascript' \
              --overwrite \
              --auth-mode key \
              --only-show-errors
        env:
          AZURE_STORAGE_ACCOUNT: mrashopdash
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}

      # Live board shell (HTML) — only on a push to main, or an explicit mode=live dispatch.
      # data.js is intentionally NOT uploaded here: it is owned by the local Export-Data.ps1,
      # which regenerates it from the workbook and pushes it to Azure on a schedule.
      - name: Upload live board files
        if: ${{ github.event_name == 'push' || inputs.mode == 'live' }}
        run: |
            az storage blob upload \
              --account-name mrashopdash \
              --container-name '$web' \
              --name 'index.html' \
              --file index.html \
              --content-type 'text/html' \
              --content-cache-control 'no-cache, must-revalidate' \
              --overwrite \
              --auth-mode key \
              --only-show-errors

            az storage blob upload \
              --account-name mrashopdash \
              --container-name '$web' \
              --name 'MRA_Dashboard.html' \
              --file MRA_Dashboard.html \
              --content-type 'text/html' \
              --content-cache-control 'no-cache, must-revalidate' \
              --overwrite \
              --auth-mode key \
              --only-show-errors
        env:
          AZURE_STORAGE_ACCOUNT: mrashopdash
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}

      - name: Verify live URL
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://mrashopdash.z13.web.core.windows.net/")
          echo "Live site HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "WARNING: site returned $STATUS — check the Azure portal"
          else
            echo "✓ Site is live"
          fi
