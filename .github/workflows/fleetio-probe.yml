name: fleetio-probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Fleetio write permission (non-destructive; token never printed)
        env:
          FKEY: ${{ secrets.FLEETIO_API_KEY }}
          FACC: ${{ secrets.FLEETIO_ACCOUNT_TOKEN }}
        run: |
          set +e
          echo "== Fleetio permission probe (only HTTP status codes are shown) =="
          g=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Token $FKEY" -H "Account-Token: $FACC" -H "Accept: application/json" \
            "https://secure.fleetio.com/api/v1/issues?per_page=1")
          echo "GET   /issues?per_page=1         -> $g    (200 = key+account valid, read works)"
          w=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH \
            -H "Authorization: Token $FKEY" -H "Account-Token: $FACC" \
            -H "Content-Type: application/json" -H "Accept: application/json" \
            -d '{}' \
            "https://secure.fleetio.com/api/v1/issues/999999999")
          echo "PATCH /issues/999999999 (fake id) -> $w    (403 = READ-ONLY; 404/422/200 = WRITE-CAPABLE)"
          echo "== done =="
