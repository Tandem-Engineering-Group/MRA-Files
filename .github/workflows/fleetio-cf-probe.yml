name: fleetio-cf-probe
on:
  workflow_dispatch:
jobs:
  cf:
    runs-on: ubuntu-latest
    steps:
      - name: Read filled Back-to-MRA date values (read-only)
        env:
          FKEY: ${{ secrets.FLEETIO_API_KEY }}
          FACC: ${{ secrets.FLEETIO_ACCOUNT_TOKEN }}
        run: |
          set +e
          B="https://secure.fleetio.com/api/v1"
          H=(-H "Authorization: Token $FKEY" -H "Account-Token: $FACC" -H "Accept: application/json")
          curl -s "${H[@]}" "$B/issues?per_page=200&q%5Bstate_eq%5D=open" -o all.json -w "GET issues -> %{http_code}\n"
          echo "count: $(jq '(if type==\"array\" then . else .records end)|length' all.json 2>/dev/null)"
          echo "issues with a Back to MRA Date filled:"
          jq -r '(if type=="array" then . else .records end)[] | select(((.custom_fields.back_to_mra_date // "")|length)>0) | "  #\(.number) | back=\(.custom_fields.back_to_mra_date) | leaving=\(.custom_fields.leaving_mra_date) | \(.vehicle_name)"' all.json 2>/dev/null
          echo "== done =="
