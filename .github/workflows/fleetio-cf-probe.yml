name: fleetio-cf-probe
on:
  workflow_dispatch:
jobs:
  cf:
    runs-on: ubuntu-latest
    steps:
      - name: Read Fleetio custom-field definitions + an issue's custom_fields (read-only)
        env:
          FKEY: ${{ secrets.FLEETIO_API_KEY }}
          FACC: ${{ secrets.FLEETIO_ACCOUNT_TOKEN }}
        run: |
          set +e
          B="https://secure.fleetio.com/api/v1"
          H=(-H "Authorization: Token $FKEY" -H "Account-Token: $FACC" -H "Accept: application/json")
          echo "== A) custom_fields definitions =="
          curl -s "${H[@]}" "$B/custom_fields" -o cf.json -w "  GET /custom_fields -> %{http_code}\n"
          echo "  keys/labels found:"
          jq -r 'if type=="array" then . else (.records // []) end | .[] | "   \(.record_type // "?") | label=\(.label // .name // "?") | key=\(.name // .key // "?") | kind=\(.kind // .field_type // .type // "?")"' cf.json 2>/dev/null | grep -i "mra\|Issue" | head -40
          echo "  (raw first 500): $(head -c 500 cf.json)"
          echo "== B) an issue that mentions MRA, show its custom_fields object =="
          IID=$(curl -s "${H[@]}" "$B/issues?per_page=100" | jq -r '[.[]|select((.description//"")|test("MRA";"i"))][0].id // empty' 2>/dev/null)
          echo "  sample issue id=$IID"
          curl -s "${H[@]}" "$B/issues/$IID" -o one.json -w "  GET issue -> %{http_code}\n"
          echo "  custom_fields on issue: $(jq -c '.custom_fields // "ABSENT"' one.json 2>/dev/null)"
          echo "  issue top-level keys: $(jq -r 'keys|join(",")' one.json 2>/dev/null | head -c 400)"
          echo "== done =="
