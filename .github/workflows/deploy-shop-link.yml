name: Pin Logistics link on Shop board

# Adds ONE menu link on the LIVE shop dashboard that opens the current MRA Logistics
# prototype (logistics.html — the v2 build with Run of Show). Removes the older
# MyMobileTour (v1) link if present, so there's a single clear entry. It fetches the
# current live shop board, edits only that link, and re-uploads MRA_Dashboard.html —
# it never touches the shop board's data (data.js) or any other file.

on:
  workflow_dispatch:
  push:
    branches: [claude/mymobiletour-dashboard-a9lkcx]
    paths: ['.github/workflows/deploy-shop-link.yml']

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch live shop board and set the Logistics link
        run: |
          curl -s "https://mrashopdash.z13.web.core.windows.net/MRA_Dashboard.html" -o shop.html
          python3 - <<'PY'
          import re
          f = 'shop.html'
          s = open(f, encoding='utf-8').read()
          # 1) remove any earlier v1 MyMobileTour link
          s2 = re.sub(r'\s*<a class="mi"[^>]*MRA_Mobile_Tour\.html[^>]*>.*?</a>', '', s)
          url = 'https://mrashopdash.z13.web.core.windows.net/logistics.html'
          changed = (s2 != s)
          s = s2
          if ('href="%s"' % url) in s:
              print('logistics link already present')
              if changed:
                  open(f, 'w', encoding='utf-8').write(s)
                  print('removed old v1 link')
          else:
              link = ('\n        <a class="mi" href="%s" target="_blank" rel="noopener" '
                      'onclick="closeDrops()" title="MRA Logistics Dashboard - current tour/logistics '
                      'prototype (with Run of Show)">\U0001F9ED MRA Logistics Dashboard (Prototype)</a>' % url)
              anchors = ['\U0001F4D6 Product Catalogue</a>', '\U0001F4DA Project Library</a>']
              done = False
              for a in anchors:
                  i = s.find(a)
                  if i != -1:
                      j = i + len(a)
                      s = s[:j] + link + s[j:]
                      open(f, 'w', encoding='utf-8').write(s)
                      print('inserted logistics link after anchor:', a)
                      done = True
                      break
              if not done:
                  raise SystemExit('ERROR: no menu anchor found - not modifying file')
          PY

      - name: Upload patched shop board to Azure ($web)
        uses: azure/CLI@v2
        with:
          azcliversion: latest
          inlineScript: |
            az storage blob upload \
              --account-name mrashopdash \
              --container-name '$web' \
              --name 'MRA_Dashboard.html' \
              --file shop.html \
              --content-type 'text/html' \
              --overwrite --auth-mode key --only-show-errors
        env:
          AZURE_STORAGE_ACCOUNT: mrashopdash
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}

      - name: Verify links
        run: |
          H=$(curl -s "https://mrashopdash.z13.web.core.windows.net/MRA_Dashboard.html")
          LOG=$(printf '%s' "$H" | grep -c "logistics.html")
          OLD=$(printf '%s' "$H" | grep -c "MRA_Mobile_Tour.html")
          echo "logistics links: $LOG | old v1 links: $OLD"
          if [ "$LOG" -lt 1 ]; then echo "WARNING: logistics link missing"; exit 1; fi
