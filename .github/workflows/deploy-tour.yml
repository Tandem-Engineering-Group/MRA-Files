name: Retire v1 Mobile Tour prototype

# One-time cleanup: v1 (MyMobileTour) has been superseded by v2 (Logistics).
# This deletes the v1 files from the Azure $web container so only Logistics remains.
# It never touches the shop board (MRA_Dashboard.html) or its data (data.js).

on:
  workflow_dispatch:
  push:
    branches: [claude/mymobiletour-dashboard-a9lkcx]
    paths: ['.github/workflows/deploy-tour.yml']

jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - name: Delete v1 blobs from Azure ($web)
        uses: azure/CLI@v2
        with:
          azcliversion: latest
          inlineScript: |
            az storage blob delete --account-name mrashopdash --container-name '$web' \
              --name 'MRA_Mobile_Tour.html' --auth-mode key --only-show-errors || true
            az storage blob delete --account-name mrashopdash --container-name '$web' \
              --name 'mmt_data.js' --auth-mode key --only-show-errors || true
        env:
          AZURE_STORAGE_ACCOUNT: mrashopdash
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}

      - name: Verify v1 is gone
        run: |
          A=$(curl -s -o /dev/null -w "%{http_code}" "https://mrashopdash.z13.web.core.windows.net/MRA_Mobile_Tour.html")
          B=$(curl -s -o /dev/null -w "%{http_code}" "https://mrashopdash.z13.web.core.windows.net/mmt_data.js")
          echo "MRA_Mobile_Tour.html -> $A ; mmt_data.js -> $B (expect 404)"
