name: Pipeline staleness watchdog

# Checks the LIVE board's listsAsOf timestamp every 10 min -- the same "DATA PIPELINE STALLED"
# condition the in-app banner already detects. If it's been stale too long, this job deliberately
# FAILS with a clear message. Rich already gets GitHub's own email notification on a failed workflow
# run for this repo (confirmed -- he's shown one arriving for a different workflow), so this reaches
# him with zero extra setup: no new Power Automate flow, no new URL/secret to manage. Debounced so
# it only fails once per stale episode (not every 10 min), and re-fails periodically if it's still
# not fixed. See CLAUDE.md's "RECURRING DATA PIPELINE STALLED" section for the history this is for.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:      # manual "Run workflow" button, for testing

permissions:
  contents: write   # commits the small last-alerted state file, only when it actually fires

concurrency:
  group: mra-pipeline-watchdog
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check staleness (fails on purpose to trigger GitHub's own failure-notification email)
        shell: bash
        env:
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
        run: |
          set -e
          curl -s https://mrashopdash.z13.web.core.windows.net/data.js -o live-data.js
          python3 <<'PYEOF'
          import re, json, os, subprocess, sys
          from datetime import datetime, timezone

          STALE_THRESHOLD_MIN = 20     # matches the in-app banner's own stall definition
          RENOTIFY_AFTER_MIN = 60      # don't fail every 10 min; re-alert hourly while still stale
          STATE_FILE = '.github/watchdog-state.json'

          def git(*args):
              subprocess.run(['git'] + list(args), check=True)

          content = open('live-data.js').read()
          m = re.search(r'=\s*(\{.*\})\s*;?\s*$', content, re.S)
          if not m:
              print('Could not parse data.js -- skipping this check.')
              sys.exit(0)
          data = json.loads(m.group(1))
          lists_as_of = data.get('listsAsOf')
          if not lists_as_of:
              print('No listsAsOf field in data.js -- skipping this check.')
              sys.exit(0)

          dt = datetime.fromisoformat(lists_as_of.replace('Z', '+00:00'))
          now = datetime.now(timezone.utc)
          stale_min = (now - dt).total_seconds() / 60
          print(f'listsAsOf: {lists_as_of}  |  stale for {stale_min:.1f} min')

          # Diagnostic: while stale, also pull the Power Automate watchdog's own state file
          # (pipeline/lists-run-state.json) and print it every check, so a full timeline of what
          # THAT watchdog was seeing during the whole stall episode is captured automatically in
          # this job's logs -- no more depending on someone manually screenshotting Power Automate
          # mid-outage and (every time so far) missing the window because the run recovered first.
          if stale_min >= STALE_THRESHOLD_MIN:
              try:
                  subprocess.run(['az', 'storage', 'blob', 'download',
                      '--account-name', 'mrashopdash', '--account-key', os.environ['AZURE_STORAGE_KEY'],
                      '--container-name', 'pipeline', '--name', 'lists-run-state.json',
                      '--file', 'lists-run-state.json', '--only-show-errors'], check=True,
                      capture_output=True, text=True)
                  state = json.load(open('lists-run-state.json'))
                  run_started = state.get('startedAt')
                  age_min = None
                  if run_started:
                      run_dt = datetime.fromisoformat(str(run_started).replace('Z', '+00:00'))
                      age_min = (now - run_dt).total_seconds() / 60
                  print(f"WATCHDOG STATE FILE (pipeline/lists-run-state.json): {json.dumps(state)}"
                        + (f"  |  that run's own age: {age_min:.1f} min" if age_min is not None else ""))
              except Exception as e:
                  print(f'Could not read the watchdog state file: {e}')

          if stale_min < STALE_THRESHOLD_MIN:
              print('Fresh enough -- nothing to do.')
              if os.path.exists(STATE_FILE):
                  os.remove(STATE_FILE)
                  git('config', 'user.name', 'github-actions[bot]')
                  git('config', 'user.email', 'github-actions[bot]@users.noreply.github.com')
                  git('add', STATE_FILE)
                  git('commit', '-m', 'watchdog: pipeline recovered, clear stale state')
                  git('push')
              sys.exit(0)

          last_notified = None
          if os.path.exists(STATE_FILE):
              with open(STATE_FILE) as f:
                  last_notified = datetime.fromisoformat(json.load(f)['lastNotified'])

          if last_notified is not None:
              since_last = (now - last_notified).total_seconds() / 60
              if since_last < RENOTIFY_AFTER_MIN:
                  print(f'Already alerted {since_last:.0f} min ago -- within the {RENOTIFY_AFTER_MIN} min debounce, skipping.')
                  sys.exit(0)

          os.makedirs('.github', exist_ok=True)
          with open(STATE_FILE, 'w') as f:
              json.dump({'lastNotified': now.isoformat()}, f)
          git('config', 'user.name', 'github-actions[bot]')
          git('config', 'user.email', 'github-actions[bot]@users.noreply.github.com')
          git('add', STATE_FILE)
          git('commit', '-m', f'watchdog: alerting at {stale_min:.0f} min stale')
          git('push')

          print('')
          print('=' * 70)
          print(f'DATA PIPELINE STALLED -- board has not synced from the Lists in {stale_min:.0f} minutes.')
          print('Cancel the stuck run(s) in "MRA Lists to JSON" (Power Automate) and Run manually.')
          print('See CLAUDE.md, "RECURRING DATA PIPELINE STALLED ISSUE" section, for history.')
          print('=' * 70)
          sys.exit(1)   # deliberate failure -- this is what triggers GitHub's email to Rich
          PYEOF
