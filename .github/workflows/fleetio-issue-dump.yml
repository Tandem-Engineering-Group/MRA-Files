name: Dump a Fleetio issue (diagnostic)

# One-shot diagnostic: fetch ONE Fleetio issue by number and print its full raw JSON to the job log.
# Built 2026-09-11 because Export-Data.ps1's guessed field names for "who resolved it" / "resolution
# note" (resolved_by_name, resolution_note, etc.) all came back empty against a real resolved issue
# (#1435, confirmed by Rich's own screenshot: Resolved By = Stephanie Pearce, resolved via a linked
# Service Entry) -- guessing again would just repeat the same mistake. Read the real field names
# instead of guessing them. Read-only: GET only, no writes, no board/data.js changes.

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Fleetio issue NUMBER (the # shown on the issue, e.g. 1435) -- not the internal id. Leave blank to skip."
        default: "1435"
        required: false
      vehicle_search:
        description: "Dump a VEHICLE instead: any text from its name, e.g. 0237. Blank = skip the vehicle dump."
        default: ""
        required: false

jobs:
  vehicle:
    if: inputs.vehicle_search != ''
    runs-on: windows-latest
    steps:
      - name: Fetch and print a vehicle's raw JSON (index record AND detail)
        shell: pwsh
        env:
          FLEETIO_API_KEY:       ${{ secrets.FLEETIO_API_KEY }}
          FLEETIO_ACCOUNT_TOKEN: ${{ secrets.FLEETIO_ACCOUNT_TOKEN }}
          VEHICLE_SEARCH:        ${{ inputs.vehicle_search }}
        run: |
          if (-not $env:FLEETIO_API_KEY -or -not $env:FLEETIO_ACCOUNT_TOKEN) {
            Write-Error "FLEETIO_API_KEY / FLEETIO_ACCOUNT_TOKEN secrets are not set."; exit 1
          }
          $headers = @{ 'Authorization' = "Token $($env:FLEETIO_API_KEY.Trim())"; 'Account-Token' = $env:FLEETIO_ACCOUNT_TOKEN.Trim(); 'Accept' = 'application/json' }

          # /vehicles is CURSOR paginated (records + next_cursor), not page-numbered.
          $found = $null; $cursor = $null; $guard = 0
          do {
            $guard++
            $url = "https://secure.fleetio.com/api/v1/vehicles?per_page=100"
            if ($cursor) { $url += "&start_cursor=$([uri]::EscapeDataString([string]$cursor))" }
            $resp = Invoke-WebRequest -Uri $url -Headers $headers -UseBasicParsing -Method GET -TimeoutSec 30
            $obj = $resp.Content | ConvertFrom-Json
            $recs = if ($null -ne $obj.records) { $obj.records } else { @($obj) }
            $found = $recs | Where-Object { [string]$_.name -like "*$($env:VEHICLE_SEARCH)*" } | Select-Object -First 1
            $cursor = if ($null -ne $obj.records) { $obj.next_cursor } else { $null }
          } while (-not $found -and $cursor -and $guard -lt 25)

          if (-not $found) { Write-Error "No vehicle name contains '$($env:VEHICLE_SEARCH)'."; exit 1 }

          Write-Host "=== INDEX record (id=$($found.id)) : $($found.name) ==="
          $found | ConvertTo-Json -Depth 8
          Write-Host "`n=== INDEX field names ==="
          $found.PSObject.Properties.Name | Sort-Object | ForEach-Object { Write-Host $_ }

          Write-Host "`n=== DETAIL record (GET /vehicles/$($found.id)) ==="
          $d = Invoke-WebRequest -Uri "https://secure.fleetio.com/api/v1/vehicles/$($found.id)" -Headers $headers -UseBasicParsing -Method GET -TimeoutSec 30
          $dobj = $d.Content | ConvertFrom-Json
          $dobj | ConvertTo-Json -Depth 8
          Write-Host "`n=== DETAIL field names ==="
          $dobj.PSObject.Properties.Name | Sort-Object | ForEach-Object { Write-Host $_ }

          Write-Host "`n=== Anything label-ish, on either ==="
          foreach ($pair in @(@('INDEX',$found), @('DETAIL',$dobj))) {
            $which = $pair[0]; $o = $pair[1]
            $o.PSObject.Properties | Where-Object { $_.Name -match 'label|tag|custom' } | ForEach-Object {
              Write-Host "[$which] $($_.Name) = $($_.Value | ConvertTo-Json -Compress -Depth 6)"
            }
          }

  dump:
    if: inputs.issue_number != ''
    runs-on: windows-latest
    steps:
      - name: Fetch and print the issue's raw JSON
        shell: pwsh
        env:
          FLEETIO_API_KEY:       ${{ secrets.FLEETIO_API_KEY }}
          FLEETIO_ACCOUNT_TOKEN: ${{ secrets.FLEETIO_ACCOUNT_TOKEN }}
          ISSUE_NUMBER:          ${{ inputs.issue_number }}
        run: |
          if (-not $env:FLEETIO_API_KEY -or -not $env:FLEETIO_ACCOUNT_TOKEN) {
            Write-Error "FLEETIO_API_KEY / FLEETIO_ACCOUNT_TOKEN secrets are not set."; exit 1
          }
          $headers = @{ 'Authorization' = "Token $($env:FLEETIO_API_KEY.Trim())"; 'Account-Token' = $env:FLEETIO_ACCOUNT_TOKEN.Trim(); 'Accept' = 'application/json' }

          # The issue detail endpoint is keyed by internal id, not the display number -- look it up first
          # via the same state-filtered list search the export already uses, matching on .number.
          $found = $null
          foreach ($state in @('resolved','open')) {
            $page = 1
            do {
              $url = "https://secure.fleetio.com/api/v1/issues?q%5Bstate_eq%5D=$state&per_page=100&page=$page"
              $resp = Invoke-WebRequest -Uri $url -Headers $headers -UseBasicParsing -Method GET -TimeoutSec 30
              $tp = $resp.Headers['X-Pagination-Total-Pages']; if ($tp -is [array]) { $tp = $tp[0] }
              $items = $resp.Content | ConvertFrom-Json
              $found = $items | Where-Object { ([string]$_.number).TrimStart('#') -eq $env:ISSUE_NUMBER } | Select-Object -First 1
              if ($found) { break }
              $page++
            } while ($tp -and $page -le [int]$tp -and $page -le 25)
            if ($found) { break }
          }
          if (-not $found) { Write-Error "Issue #$($env:ISSUE_NUMBER) not found in open or resolved state (checked up to 25 pages each)."; exit 1 }

          Write-Host "=== Full raw issue JSON (id=$($found.id), number=$($found.number)) ==="
          $detail = Invoke-WebRequest -Uri "https://secure.fleetio.com/api/v1/issues/$($found.id)" -Headers $headers -UseBasicParsing -Method GET -TimeoutSec 30
          $obj = $detail.Content | ConvertFrom-Json
          $obj | ConvertTo-Json -Depth 8

          Write-Host "`n=== Field names only (top level) ==="
          $obj.PSObject.Properties.Name | Sort-Object | ForEach-Object { Write-Host $_ }

          # The issue itself carries NO "resolved by" field -- it resolves via a linked record
          # (resolvable_type/resolvable_id, e.g. a ServiceEntry). Follow that link too so the real
          # "who" field can be read directly instead of guessed a second time.
          if ($obj.resolvable_type -and $obj.resolvable_id) {
            $rtype = [string]$obj.resolvable_type
            $rid = [string]$obj.resolvable_id
            $endpoint = switch ($rtype) {
              'ServiceEntry' { 'service_entries' }
              'WorkOrder'    { 'work_orders' }
              default        { $null }
            }
            if ($endpoint) {
              Write-Host "`n=== Linked $rtype (id=$rid) raw JSON ==="
              try {
                $rdetail = Invoke-WebRequest -Uri "https://secure.fleetio.com/api/v1/$endpoint/$rid" -Headers $headers -UseBasicParsing -Method GET -TimeoutSec 30
                $robj = $rdetail.Content | ConvertFrom-Json
                $robj | ConvertTo-Json -Depth 8
                Write-Host "`n=== Linked $rtype field names only (top level) ==="
                $robj.PSObject.Properties.Name | Sort-Object | ForEach-Object { Write-Host $_ }
              } catch { Write-Warning "Could not fetch linked $rtype ${rid}: $($_.Exception.Message)" }
            } else {
              Write-Host "`n(resolvable_type '$rtype' has no known endpoint mapping in this diagnostic -- add one if this recurs)"
            }
          } else {
            Write-Host "`n(no resolvable_type/resolvable_id on this issue -- nothing to follow)"
          }
