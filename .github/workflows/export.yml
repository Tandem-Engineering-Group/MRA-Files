name: Cloud export (data.js)

# Runs Export-Data.ps1 in the cloud so the dashboard stays fresh without Rich's PC.
# A small Power Automate flow copies the workbook to the private "pipeline" blob
# container every ~15 min; this job downloads it, runs the EXISTING export script
# (workbook + Fleetio + Samsara), and the script pushes data.js to the live site.
# See CLOUD-EXPORT-SETUP.md for the one-time setup (secrets + shuttle flow + container).

on:
  workflow_dispatch:          # manual "Run workflow" button (works from any branch)
  repository_dispatch:
    types: [run-export]       # fired by the Power Automate shuttle (reliable) right after it uploads the workbook
  schedule:
    - cron: '*/15 * * * *'    # backup only - GitHub's scheduler is unreliable; the shuttle's repository_dispatch is the real trigger

concurrency:
  group: mra-cloud-export
  cancel-in-progress: false   # never interrupt a run mid-write; let it finish

permissions:
  contents: read

jobs:
  export:
    runs-on: windows-latest   # the script is Windows-authored (az CLI is preinstalled here)
    steps:
      - uses: actions/checkout@v4

      - name: Stage secrets (token files the script expects, never committed)
        shell: pwsh
        env:
          FLEETIO_API_KEY:       ${{ secrets.FLEETIO_API_KEY }}
          FLEETIO_ACCOUNT_TOKEN: ${{ secrets.FLEETIO_ACCOUNT_TOKEN }}
          SAMSARA_TOKEN:         ${{ secrets.SAMSARA_TOKEN }}
          AZURE_STORAGE_KEY:     ${{ secrets.AZURE_STORAGE_KEY }}
        run: |
          if ($env:FLEETIO_API_KEY) { "$env:FLEETIO_API_KEY`r`n$env:FLEETIO_ACCOUNT_TOKEN" | Set-Content -Path fleetio.txt -Encoding ascii -NoNewline }
          if ($env:SAMSARA_TOKEN)   { $env:SAMSARA_TOKEN     | Set-Content -Path samsara.txt   -Encoding ascii -NoNewline }
          if ($env:AZURE_STORAGE_KEY) { $env:AZURE_STORAGE_KEY | Set-Content -Path azure-key.txt -Encoding ascii -NoNewline }
          else { Write-Error "AZURE_STORAGE_KEY secret is required"; exit 1 }

      - name: Ensure the private "pipeline" container exists (no portal needed - uses the key)
        shell: pwsh
        env:
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
        run: |
          az storage container create `
            --account-name mrashopdash `
            --account-key "$env:AZURE_STORAGE_KEY" `
            --name pipeline `
            --only-show-errors | Out-Null

      # Two flows can kick this workflow ~1 min apart (the workbook shuttle at :00/:15/:30/:45 and the
      # "MRA Lists to JSON" auto-kick just before it). If a run downloads the workbook exactly while the
      # shuttle is REPLACING the blob, the file arrives truncated ("Central Directory corrupt"). So:
      # verify the .xlsx opens as a complete zip, and retry after a pause if it does not.
      - name: Download the workbook from the pipeline blob (verify + retry if caught mid-copy)
        shell: pwsh
        env:
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
        run: |
          $dest = "$env:GITHUB_WORKSPACE\workbook.xlsx"
          $ok = $false
          for ($try = 1; $try -le 3; $try++) {
            if (Test-Path $dest) { Remove-Item $dest -Force }
            az storage blob download `
              --account-name mrashopdash `
              --account-key "$env:AZURE_STORAGE_KEY" `
              --container-name pipeline `
              --name MRA_Shop_Board.xlsx `
              --file $dest `
              --only-show-errors
            if (Test-Path $dest) {
              try {
                Add-Type -AssemblyName System.IO.Compression.FileSystem
                $z = [System.IO.Compression.ZipFile]::OpenRead($dest); $z.Dispose()
                $ok = $true; break
              } catch { Write-Warning "Attempt ${try}: workbook zip is incomplete (shuttle likely mid-copy) - retrying in 25s" }
            } else { Write-Warning "Attempt ${try}: download produced no file - retrying in 25s" }
            Start-Sleep -Seconds 25
          }
          if (-not $ok) { Write-Error "Workbook could not be downloaded intact after 3 tries - is the shuttle flow running and the 'pipeline' container populated?"; exit 1 }

      - name: Run the export (builds + pushes data.js)
        shell: pwsh
        env:
          MRA_WORKBOOK: ${{ github.workspace }}\workbook.xlsx
        run: |
          ./Export-Data.ps1

      # CUTOVER (Step 3): the board now reads the SharePoint LISTS, not the workbook. The export above
      # still runs so the FLEETIO/Samsara fleet data stays fresh; this step overrides the board sections
      # (jobs/projects/tasks/users/holidays) from lists.json (kept fresh by the "MRA Lists to JSON" flow)
      # and republishes data.js. FAIL-SAFE: if lists.json is missing or the build errors, it leaves the
      # workbook-built data.js live, so the board never goes dark.
      - name: Override board data from the SharePoint Lists (keep fresh fleet)
        if: always()
        shell: pwsh
        env:
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
        run: |
          try {
            az storage blob download --account-name mrashopdash --account-key "$env:AZURE_STORAGE_KEY" `
              --container-name pipeline --name lists.json --file lists.json --only-show-errors
            if (-not (Test-Path lists.json)) { throw "lists.json not present in the pipeline container" }
            if (-not (Test-Path data.js))    { throw "data.js (workbook build) not present to use as fleet base" }
            $asof = az storage blob show --account-name mrashopdash --account-key "$env:AZURE_STORAGE_KEY" `
              --container-name pipeline --name lists.json --query properties.lastModified -o tsv
            python build_from_lists.py --lists lists.json --base data.js --out data.js --asof "$asof"
            az storage blob upload --account-name mrashopdash --account-key "$env:AZURE_STORAGE_KEY" `
              --container-name '$web' --name data.js --file data.js `
              --content-type 'application/javascript' --content-cache-control 'no-cache, must-revalidate' `
              --overwrite --only-show-errors
            Write-Host "data.js rebuilt from the SharePoint Lists (board) + fresh fleet, and republished."
          } catch {
            Write-Warning "Lists override skipped ($($_.Exception.Message)) - leaving the workbook-built data.js live."
          }

      # Daily backup: first run after midnight UTC snapshots the whole board state into the PRIVATE
      # pipeline container under backups/YYYY-MM-DD/ - lists.json (SharePoint Lists truth), data.js
      # (rendered board), design.json (design-board notes), and the workbook copy. Never fails the run.
      - name: Daily backup snapshot (pipeline/backups/YYYY-MM-DD/)
        if: always()
        shell: pwsh
        env:
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
        run: |
          try {
            $acct = @('--account-name','mrashopdash','--account-key',"$env:AZURE_STORAGE_KEY",'--only-show-errors')
            $day = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd')
            $probe = az storage blob exists @acct --container-name pipeline --name "backups/$day/lists.json" | ConvertFrom-Json
            if ($probe.exists) { Write-Host "Backup for $day already taken - skipping."; exit 0 }
            if (Test-Path lists.json) { az storage blob upload @acct --container-name pipeline --name "backups/$day/lists.json" --file lists.json --overwrite | Out-Null }
            if (Test-Path data.js)    { az storage blob upload @acct --container-name pipeline --name "backups/$day/data.js" --file data.js --overwrite | Out-Null }
            if (Test-Path "$env:GITHUB_WORKSPACE\workbook.xlsx") { az storage blob upload @acct --container-name pipeline --name "backups/$day/MRA_Shop_Board.xlsx" --file "$env:GITHUB_WORKSPACE\workbook.xlsx" --overwrite | Out-Null }
            try {
              az storage blob download @acct --container-name '$web' --name design.json --file design-backup.json | Out-Null
              if (Test-Path design-backup.json) { az storage blob upload @acct --container-name pipeline --name "backups/$day/design.json" --file design-backup.json --overwrite | Out-Null }
            } catch { Write-Host "(no design.json to back up)" }
            Write-Host "Backup written: pipeline/backups/$day/ (lists.json, data.js, workbook, design.json)"
          } catch { Write-Warning "Backup step skipped: $($_.Exception.Message)" }

      - name: Confirm the run finished OK
        if: always()
        shell: pwsh
        run: |
          if (Test-Path export-last-run.txt) {
            $r = (Get-Content export-last-run.txt -Raw).Trim()
            Write-Host "Last run: $r"
            if ($r -notmatch '\bOK\b') { Write-Error "Export did not finish cleanly (data.js may not have published)."; exit 1 }
          } else {
            Write-Error "No export-last-run.txt was produced - the script did not complete."; exit 1
          }
