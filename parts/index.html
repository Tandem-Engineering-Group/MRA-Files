<title>MRA Parts &amp; Materials</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2128; --line:#30363d; --txt:#e6edf3;
    --muted:#8b949e; --faint:#6e7681; --brand:#e04826; --blue:#58a6ff; --green:#3fb950; --amber:#d29922;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--txt);font-family:'Segoe UI',system-ui,Arial,sans-serif;font-size:15px}
  a{color:var(--blue);text-decoration:none} a:hover{text-decoration:underline}
  header{position:sticky;top:0;z-index:10;background:linear-gradient(180deg,#0d1117 72%,rgba(13,17,23,.92));border-bottom:2px solid var(--brand);padding:14px 20px 12px}
  .h-row{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  h1{font-size:20px;margin:0;font-weight:800} h1 .mra{color:var(--brand)}
  .sub{color:var(--muted);font-size:12.5px}
  .back{margin-left:auto;font-size:13px}
  .tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:11px;align-items:center}
  #q{flex:1;min-width:240px;padding:10px 13px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--txt);font-size:15px}
  #q::placeholder{color:var(--faint)}
  select,.tbtn{padding:9px 11px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;color:var(--txt);font-size:13px;cursor:pointer;max-width:220px}
  .tbtn.on{border-color:var(--brand);color:#fff}
  .hint{color:var(--faint);font-size:12.5px;margin:3px 0 0}
  main{padding:14px 20px 60px;max-width:1180px;margin:0 auto}
  .rows{display:flex;flex-direction:column;gap:8px}
  .row{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px 14px}
  .row.fee{opacity:.6}
  .desc{font-weight:700;font-size:14px;line-height:1.35;white-space:pre-line}
  .mk{color:var(--muted);font-size:12px;margin-top:2px}
  .mk b{color:var(--txt);font-weight:600}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
  .c{font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
  .c.job{color:var(--brand);border-color:rgba(224,72,38,.4)}
  .c.ven{color:var(--blue);border-color:rgba(88,166,255,.35)}
  .c.cost{color:var(--green);border-color:rgba(63,185,80,.35)}
  .c.date{color:var(--amber);border-color:rgba(210,153,34,.35)}
  .notes{color:var(--faint);font-size:11.5px;margin-top:6px;font-style:italic;white-space:pre-line}
  mark{background:rgba(224,72,38,.35);color:var(--txt);border-radius:2px;padding:0 1px}
  .empty{color:var(--muted);font-style:italic;padding:30px 4px}
  .count{color:var(--muted);font-size:12.5px;margin:2px 0 10px}
  .count b{color:var(--txt)}
  .foot{color:var(--faint);font-size:11.5px;margin-top:24px;text-align:center}
</style>
</head>

var DATA=(window.MRA_PARTS||[]);
var HIDE_FEE=true;
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function hl(s,toks){s=esc(s);toks.forEach(function(t){if(!t)return;try{s=s.replace(new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>')}catch(e){}});return s}
function norm(s){return String(s||'').toLowerCase()}
function money(v){return (typeof v==='number')?('$'+v.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})):''}
var FEE=/^(shipping|sales tax|tax|freight|handling)$/i;
function isFee(p){return FEE.test((p.desc||'').trim())}

(function(){
  var js={},vs={};
  DATA.forEach(function(p){if(p.job)js[p.job]=1;if(p.vendor)vs[p.vendor]=1});
  var jsel=$('job'); Object.keys(js).sort().forEach(function(j){var o=document.createElement('option');o.value=j;o.textContent=j;jsel.appendChild(o)});
  var vsel=$('vendor'); Object.keys(vs).sort().forEach(function(v){var o=document.createElement('option');o.value=v;o.textContent=v;vsel.appendChild(o)});
  $('stamp').textContent=DATA.length+' line items · '+Object.keys(vs).length+' vendors · '+Object.keys(js).length+' jobs';
})();

function render(){
  var q=norm($('q').value).trim();
  var toks=q?q.split(/\s+/).filter(Boolean):[];
  var jobF=$('job').value, venF=$('vendor').value, sort=$('sort').value;
  var list=DATA.filter(function(p){
    if(HIDE_FEE && isFee(p)) return false;
    if(jobF && p.job!==jobF) return false;
    if(venF && p.vendor!==venF) return false;
    if(toks.length){ var hay=norm([p.desc,p.make,p.model,p.vendor,p.job,p.notes].filter(Boolean).join(' ')); if(!toks.every(function(t){return hay.indexOf(t)>=0})) return false; }
    return true;
  });
  if(sort==='cost') list.sort(function(a,b){return (b.ext||b.unitCost||0)-(a.ext||a.unitCost||0)});
  else if(sort==='date') list.sort(function(a,b){return String(b.orderDate||'').localeCompare(String(a.orderDate||''))});
  else if(sort==='az') list.sort(function(a,b){return String(a.desc||'').localeCompare(String(b.desc||''))});
  else list.sort(function(a,b){return String(b.orderDate||'').localeCompare(String(a.orderDate||''))});
  var spend=list.reduce(function(a,p){return a+(typeof p.ext==='number'?p.ext:(typeof p.unitCost==='number'?p.unitCost:0))},0);
  $('cnt').innerHTML='<b>'+list.length+'</b> item'+(list.length===1?'':'s')+(spend?' · '+money(spend)+' total':'');
  var html=list.slice(0,600).map(function(p){
    var chips='';
    if(p.job) chips+='<span class="c job">'+hl(p.job,toks)+'</span>';
    if(p.vendor) chips+='<span class="c ven">'+hl(p.vendor,toks)+'</span>';
    if(p.qty) chips+='<span class="c">Qty '+esc(p.qty)+'</span>';
    if(typeof p.unitCost==='number') chips+='<span class="c cost">'+money(p.unitCost)+' ea</span>';
    if(p.orderDate) chips+='<span class="c date">ordered '+esc(p.orderDate)+'</span>';
    if(p.received) chips+='<span class="c">rcvd '+esc(p.received)+'</span>';
    var mk=[]; if(p.make) mk.push('<b>'+hl(p.make,toks)+'</b>'); if(p.model) mk.push(hl(p.model,toks));
    return '<div class="row'+(isFee(p)?' fee':'')+'">'+
      '<div class="desc">'+hl(p.desc||'(no description)',toks)+'</div>'+
      (mk.length?'<div class="mk">'+mk.join(' · ')+'</div>':'')+
      '<div class="chips">'+chips+'</div>'+
      (p.notes?'<div class="notes">'+hl(p.notes,toks)+'</div>':'')+
    '</div>';
  }).join('');
  if(list.length>600) html+='<div class="empty">Showing first 600 — refine your search to narrow.</div>';
  $('rows').innerHTML=list.length?html:'<div class="empty">No parts match “'+esc($('q').value)+'”.</div>';
  $('hint').style.display=toks.length?'none':'';
}
$('q').addEventListener('input',render);
['job','vendor','sort'].forEach(function(id){$(id).addEventListener('change',render)});
$('feeBtn').addEventListener('click',function(){HIDE_FEE=!HIDE_FEE;this.classList.toggle('on',HIDE_FEE);this.textContent=HIDE_FEE?'Hide shipping/tax lines':'Show shipping/tax lines';render()});
render();
</script>
