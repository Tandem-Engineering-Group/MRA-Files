name = "mra-files"
main = "src/worker.js"
compatibility_date = "2026-01-01"

# Static UI (the /public folder) is served for every non-/api path.
[assets]
directory = "./public"
binding = "ASSETS"

# Daily run: 11:00 UTC ≈ 7:00 AM US Eastern (summer/EDT; 6 AM in winter/EST).
[triggers]
crons = ["0 11 * * *"]

# Non-secret config. Craigslist region + radius (Oxford, MI 48371, 100 miles).
[vars]
CRAIGSLIST_REGION = "detroit"
CRAIGSLIST_POSTAL = "48371"
CRAIGSLIST_DISTANCE = "100"

# --- Bind your KV namespace here after you create it (id from the dashboard) ---
[[kv_namespaces]]
binding = "KV"
id = "e8fb1691597f4bc08eadf53a3e60deeb"

# Secrets are NOT stored here. Set them in the dashboard (Settings → Variables)
# or via `wrangler secret put NAME`:
#   APP_TOKEN            (an access word you choose)
#   EBAY_CLIENT_ID       (eBay developer App ID — enables eBay results)
#   EBAY_CLIENT_SECRET   (eBay developer Cert ID)
#   RESEND_API_KEY       (enables email alerts)
