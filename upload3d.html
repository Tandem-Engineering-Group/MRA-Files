<meta charset="utf-8">
<title>MRA File Staging Upload</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:#0f1420;color:#e8ecf4;font:15px/1.5 -apple-system,Segoe UI,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{width:100%;max-width:620px;background:#171d2c;border:1px solid #2a3348;border-radius:14px;padding:28px}
  h1{font-size:19px;margin:0 0 6px;color:#fff}
  .sub{color:#93a0b8;font-size:13px;margin:0 0 20px}
  .drop{border:2px dashed #3a4660;border-radius:12px;padding:36px 16px;text-align:center;color:#93a0b8;cursor:pointer;transition:.15s}
  .drop.over{border-color:#e04826;background:#1c2436;color:#fff}
  .drop input{display:none}
  .dirbtn{margin-top:10px;width:100%;padding:10px;border:1px solid #3a4660;border-radius:10px;background:transparent;color:#93a0b8;font-size:13px;cursor:pointer}
  .dirbtn:hover{border-color:#e04826;color:#fff}
  .filelist{margin-top:16px;display:none}
  .frow{padding:10px 14px;background:#1c2436;border-radius:10px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
  .frow b{color:#fff;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .frow .sz{color:#93a0b8;flex-shrink:0}
  .frow .st{flex-shrink:0;font-weight:700;font-size:12px;min-width:70px;text-align:right}
  .frow .st.pending{color:#93a0b8}
  .frow .st.up{color:#e04826}
  .frow .st.ok{color:#4ade80}
  .frow .st.err{color:#f87171}
  .go{margin-top:16px;width:100%;padding:12px;border:0;border-radius:10px;background:#e04826;color:#fff;font-weight:700;font-size:14.5px;cursor:pointer;display:none}
  .go:disabled{opacity:.5;cursor:default}
  .bar{margin-top:16px;height:10px;border-radius:6px;background:#1c2436;overflow:hidden;display:none}
  .bar>i{display:block;height:100%;width:0%;background:#e04826;transition:width .2s}
  .status{margin-top:12px;font-size:13.5px;color:#93a0b8;white-space:pre-wrap}
  .status.err{color:#f87171}
  .status.ok{color:#4ade80}
  .err-box{margin-top:16px;padding:14px;background:#2a1616;border:1px solid #5c2626;border-radius:10px;color:#fca5a5;font-size:13.5px;display:none}
</style>

<div class="card">
  <h1>📦 MRA File Staging Upload</h1>
  <p class="sub" id="subtitle">Drag as many files as you want — a whole folder is fine — and every one gets uploaded, not just the first.</p>

  <div id="missing" class="err-box">This link is missing its upload destination. Get a fresh link before trying again.</div>

  <div id="dropzone" class="drop">
    <div id="dropText">Drag files here (or a whole folder selection), or click to choose</div>
    <input type="file" id="fileInput" multiple>
  </div>
  <button class="dirbtn" id="dirBtn" type="button">📁 Choose a folder instead</button>
  <input type="file" id="dirInput" webkitdirectory multiple style="display:none">

  <div class="filelist" id="filelist"></div>
  <button class="go" id="goBtn">Upload all</button>
  <div class="bar" id="bar"><i id="barFill"></i></div>
  <div class="status" id="status"></div>
</div>

<script>
(function(){
  var CHUNK = 32 * 1024 * 1024; // 32MB per block — safely within Azure block-blob limits

  function parseHash(){
    var h = location.hash.replace(/^#/, '');
    var out = {};
    h.split('&').forEach(function(kv){
      if(!kv) return;
      var i = kv.indexOf('=');
      if(i < 0) return;
      out[decodeURIComponent(kv.slice(0,i))] = decodeURIComponent(kv.slice(i+1));
    });
    return out;
  }

  var params = parseHash();
  var containerUrl = params.c || ''; // full container SAS URL: https://acct.blob.core.windows.net/container?sv=...
  var defaultBlobName = params.b || ''; // only meaningful when exactly one file is queued

  var dropzone = document.getElementById('dropzone');
  var fileInput = document.getElementById('fileInput');
  var dirBtn = document.getElementById('dirBtn');
  var dirInput = document.getElementById('dirInput');
  var filelistEl = document.getElementById('filelist');
  var goBtn = document.getElementById('goBtn');
  var bar = document.getElementById('bar');
  var barFill = document.getElementById('barFill');
  var statusEl = document.getElementById('status');
  var missing = document.getElementById('missing');

  if(!containerUrl){
    missing.style.display = 'block';
    dropzone.style.display = 'none';
    return;
  }

  // queue = [{file, relPath, status:'pending'|'up'|'ok'|'err', el}]
  var queue = [];

  function humanSize(n){
    if(n > 1024*1024*1024) return (n/1024/1024/1024).toFixed(2)+' GB';
    if(n > 1024*1024) return (n/1024/1024).toFixed(1)+' MB';
    return Math.ceil(n/1024)+' KB';
  }
  var STLABEL={pending:'waiting',up:'uploading…',ok:'✓ done',err:'✗ failed'};

  function renderQueue(){
    filelistEl.innerHTML = '';
    filelistEl.style.display = queue.length ? 'block' : 'none';
    queue.forEach(function(item, i){
      var row = document.createElement('div');
      row.className = 'frow';
      row.innerHTML = '<b>'+item.relPath+'</b><span class="sz">'+humanSize(item.file.size)+'</span><span class="st '+item.status+'">'+STLABEL[item.status]+'</span>';
      filelistEl.appendChild(row);
      item.el = row;
    });
    goBtn.style.display = queue.length ? 'block' : 'none';
  }

  // items = [{file, relPath}] — relPath keeps a folder's internal structure (so files with the
  // same name in different subfolders, e.g. two "diffuse.png" textures, don't overwrite each other).
  function addFiles(items){
    var added = 0;
    for(var i=0;i<items.length;i++){
      var it = items[i], f = it.file || it;
      if(!f || (f.size===0 && f.name==='')) continue;   // folders sometimes surface as 0-byte/empty entries
      queue.push({file:f, relPath: it.relPath || f.name, status:'pending'});
      added++;
    }
    if(added){ statusEl.textContent=''; statusEl.className='status'; renderQueue(); }
  }

  // Real folder support: plain dataTransfer.files never gives you a dropped folder's CONTENTS, only
  // whatever loose files were dragged directly — a folder itself doesn't show up as a readable File.
  // Walking into it requires the (widely-supported, despite the prefix) webkitGetAsEntry API to read
  // each DataTransferItem as a file/directory entry and recurse. Falls back to plain files if that
  // API isn't there (older browsers) so loose-file drags keep working exactly as before.
  function readEntryFile(entry){
    return new Promise(function(resolve, reject){ entry.file(resolve, reject); });
  }
  function readAllDirEntries(dirEntry){
    var reader = dirEntry.createReader();
    var all = [];
    function readBatch(){
      return new Promise(function(resolve, reject){ reader.readEntries(resolve, reject); }).then(function(entries){
        if(!entries.length) return all;
        all = all.concat(entries);
        return readBatch();   // readEntries only returns a batch at a time — keep calling till it's empty
      });
    }
    return readBatch();
  }
  async function walkEntry(entry, out){
    if(entry.isFile){
      var f = await readEntryFile(entry);
      out.push({file:f, relPath: entry.fullPath.replace(/^\//, '')});
    } else if(entry.isDirectory){
      var entries = await readAllDirEntries(entry);
      for(var i=0;i<entries.length;i++){ await walkEntry(entries[i], out); }
    }
  }
  // A folder that couldn't actually be read (webkitGetAsEntry missing/unreliable in this browser)
  // surfaces as a phantom 0-byte "file" named after the folder, with no extension — e.g. dragging a
  // folder full of subfolders "Interior", "Exterior", "CAB" produced exactly those four 0 KB entries
  // instead of their real contents. A genuine intentional 0-byte file is rare and normally still has
  // an extension, so this is a safe, targeted filter rather than a real-file false-positive risk.
  function looksLikeUnreadableFolder(f){ return f.size === 0 && f.name.indexOf('.') < 0; }

  async function itemsFromDataTransfer(dataTransfer){
    var out = [], skipped = 0;
    var items = dataTransfer.items;
    if(items && items.length){
      var entries = [], plainFiles = [];
      for(var i=0;i<items.length;i++){
        var it = items[i];
        var entry = (it.webkitGetAsEntry && it.webkitGetAsEntry()) || null;
        if(entry){ entries.push(entry); continue; }
        var f = (it.getAsFile && it.getAsFile()) || null;
        if(f) plainFiles.push(f);
      }
      for(var i=0;i<entries.length;i++){ await walkEntry(entries[i], out); }
      for(var i=0;i<plainFiles.length;i++){ out.push({file:plainFiles[i], relPath:plainFiles[i].name}); }
    } else if(dataTransfer.files){
      for(var i=0;i<dataTransfer.files.length;i++){ out.push({file:dataTransfer.files[i], relPath:dataTransfer.files[i].name}); }
    }
    var real = out.filter(function(it){ return !looksLikeUnreadableFolder(it.file); });
    skipped = out.length - real.length;
    return { items: real, skipped: skipped };
  }

  dropzone.addEventListener('click', function(){ fileInput.click(); });
  fileInput.addEventListener('change', function(e){
    var items = []; for(var i=0;i<e.target.files.length;i++){ items.push({file:e.target.files[i], relPath:e.target.files[i].name}); }
    addFiles(items); fileInput.value='';
  });
  // Native folder picker — sidesteps the drag-and-drop entry API entirely (unreliable in some
  // browsers, per the "Interior"/"Exterior"/"CAB" 0-byte mix-up). webkitRelativePath is set
  // directly by the browser on every file the OS folder dialog returns, no recursion needed.
  dirBtn.addEventListener('click', function(){ dirInput.click(); });
  dirInput.addEventListener('change', function(e){
    var items = [];
    for(var i=0;i<e.target.files.length;i++){
      var f = e.target.files[i];
      items.push({file:f, relPath: f.webkitRelativePath || f.name});
    }
    addFiles(items); dirInput.value='';
  });
  ['dragenter','dragover'].forEach(function(ev){
    dropzone.addEventListener(ev, function(e){ e.preventDefault(); dropzone.classList.add('over'); });
  });
  ['dragleave','drop'].forEach(function(ev){
    dropzone.addEventListener(ev, function(e){ e.preventDefault(); dropzone.classList.remove('over'); });
  });
  dropzone.addEventListener('drop', function(e){
    if(!e.dataTransfer) return;
    statusEl.textContent = 'Reading dropped files…'; statusEl.className = 'status';
    itemsFromDataTransfer(e.dataTransfer).then(function(result){
      if(result.items.length) addFiles(result.items);
      if(result.skipped){
        statusEl.className = 'status err';
        statusEl.textContent = '⚠ Skipped ' + result.skipped + ' folder' + (result.skipped===1?'':'s') + ' this browser couldn\'t read directly — use "'+dirBtn.textContent+'" below instead.';
      } else {
        statusEl.textContent = '';
      }
    }).catch(function(err){
      statusEl.className = 'status err';
      statusEl.textContent = '⚠ Could not read the dropped folder: ' + err.message + ' — use "'+dirBtn.textContent+'" below instead.';
    });
  });

  function blockIdFor(i){
    var s = 'block-' + String(i).padStart(10, '0');
    return btoa(s);
  }

  function urlWith(blobName, extraQS){
    var qIdx = containerUrl.indexOf('?');
    var base = qIdx >= 0 ? containerUrl.slice(0, qIdx) : containerUrl;
    var qs = qIdx >= 0 ? containerUrl.slice(qIdx+1) : '';
    return base + '/' + blobName.split('/').map(encodeURIComponent).join('/') + '?' + qs + '&' + extraQS;
  }

  function putWithRetry(url, body, headers, attempts){
    attempts = attempts || 3;
    var lastErr;
    function attempt(n){
      return fetch(url, { method: 'PUT', headers: headers, body: body }).then(function(r){
        if(!r.ok) return r.text().then(function(t){ throw new Error('HTTP '+r.status+': '+t.slice(0,300)); });
        return r;
      }).catch(function(e){
        lastErr = e;
        if(n >= attempts) throw lastErr;
        return new Promise(function(res){ setTimeout(res, 1000*n); }).then(function(){ return attempt(n+1); });
      });
    }
    return attempt(1);
  }

  async function uploadOne(item, blobName){
    var file = item.file, total = file.size;
    var chunks = Math.max(1, Math.ceil(total / CHUNK));
    var blockIds = [];
    for (var i = 0; i < chunks; i++) {
      var start = i * CHUNK;
      var end = Math.min(start + CHUNK, total);
      var slice = file.slice(start, end);
      var blockId = blockIdFor(i);
      blockIds.push(blockId);
      statusEl.textContent = 'Uploading "'+file.name+'" — part ' + (i+1) + ' of ' + chunks + '  (' + humanSize(end) + ' / ' + humanSize(total) + ')';
      await putWithRetry(
        urlWith(blobName, 'comp=block&blockid=' + encodeURIComponent(blockId)),
        slice,
        { 'Content-Type': 'application/octet-stream' }
      );
    }
    var xml = '<?xml version="1.0" encoding="utf-8"?><BlockList>' +
      blockIds.map(function(id){ return '<Latest>'+id+'</Latest>'; }).join('') +
      '</BlockList>';
    await putWithRetry(
      urlWith(blobName, 'comp=blocklist'),
      xml,
      { 'Content-Type': 'application/xml' }
    );
  }

  async function uploadAll(){
    goBtn.disabled = true;
    bar.style.display = 'block';
    statusEl.className = 'status';
    var grandTotal = queue.reduce(function(a,q){ return a+q.file.size; }, 0) || 1;
    var doneBytes = 0;
    var okCount = 0, errCount = 0;

    for (var qi = 0; qi < queue.length; qi++){
      var item = queue[qi];
      item.status = 'up';
      if(item.el) item.el.querySelector('.st').className='st up', item.el.querySelector('.st').textContent=STLABEL.up;
      var blobName = (queue.length===1 && defaultBlobName) ? defaultBlobName : item.relPath;
      try {
        await uploadOne(item, blobName);
        item.status = 'ok'; okCount++;
      } catch (err) {
        item.status = 'err'; errCount++;
        console.error('upload failed for', item.relPath, err);
      }
      if(item.el){ var stEl=item.el.querySelector('.st'); stEl.className='st '+item.status; stEl.textContent=STLABEL[item.status]; }
      doneBytes += item.file.size;
      barFill.style.width = Math.round((doneBytes/grandTotal)*100) + '%';
    }

    if(errCount===0){
      statusEl.className = 'status ok';
      statusEl.textContent = '✅ All '+okCount+' file'+(okCount===1?'':'s')+' uploaded. You can close this tab.';
    } else {
      statusEl.className = 'status err';
      statusEl.textContent = '⚠ '+okCount+' uploaded, '+errCount+' failed — scroll up to see which, then click "Upload all" again to retry just those.';
      // Drop the successful ones so a retry only re-sends what actually failed.
      queue = queue.filter(function(it){ return it.status==='err'; });
      queue.forEach(function(it){ it.status='pending'; });
      renderQueue();
    }
    goBtn.disabled = false;
  }

  goBtn.addEventListener('click', uploadAll);
})();
</script>
