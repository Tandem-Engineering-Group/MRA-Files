<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MRA Command Center</title>
<link rel="stylesheet" href="styles.css">
</head><body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo">M</div><span>MRA Command Center</span></div>
    <nav class="nav">
      <button class="active" data-page="home">⌂ <span>Home</span></button>
      <button data-page="shop">▦ <span>Shop</span></button>
      <button data-page="projects">◫ <span>Projects</span></button>
      <button data-page="maintenance">⚙ <span>Maintenance</span></button>
      <button data-page="assets">🚛 <span>Assets</span></button>
      <button data-page="tasks">✓ <span>My Work</span></button>
      <button data-page="tools">⌁ <span>Tools</span></button>
      <button data-page="sales">↗ <span>Sales</span></button>
    </nav>
    <div class="sidefoot"><a href="../MRA_Dashboard.html">← Classic board</a></div>
  </aside>
  <div class="shell">
    <header class="top">
      <div class="crumb">Home</div>
      <div class="topright">
        <button class="btn" id="theme">☾ Dark</button>
        <div class="quick" id="quick"><button class="btn" id="quickBtn">⌁ Quick Links ▾</button>
          <div class="quickmenu">
            <a href="https://secure.fleetio.com/8cf2193b5d/dashboard" target="_blank" rel="noopener">Fleetio <small class="muted">Asset management ↗</small></a>
            <a href="../builder.html" target="_blank" rel="noopener">Infowheel 3D ↗</a>
            <a href="../catalogue/index.html" target="_blank" rel="noopener">Product Catalogue ↗</a>
            <a href="../MRA_Dashboard.html" target="_blank" rel="noopener">Classic board ↗</a>
          </div>
        </div>
        <button class="btn" id="userBtn">Sign in ▾</button>
      </div>
    </header>
    <main class="main">
      <section id="home" class="page active"></section>
      <section id="boardhost" class="page"></section>
      <section id="shop" class="page"></section>
      <section id="projects" class="page projectpage"></section>
      <section id="maintenance" class="page"></section>
      <section id="tasks" class="page"></section>
      <section id="tools" class="page"></section>
      <section id="sales" class="page"></section>
    </main>
  </div>
</div>

<!-- Floor View (shop-TV / wall) -->
<div class="floor" id="floor">
  <div class="floortop"><div><h1>Shop Floor</h1><p>Live bay occupancy and tasks by person</p></div>
    <button class="btn" id="floorClose">Exit Floor View</button></div>
  <div class="floorwrap"><div class="floorbays" id="floorBays"></div><div class="floorcrews" id="floorCrews"></div></div>
</div>

<script src="../data.js"></script>
<script src="app.js"></script>
<script src="pages/home.js"></script>
<script src="pages/shop.js"></script>
<script src="pages/floor.js"></script>
<script src="pages/projects.js"></script>
<script src="pages/maintenance.js"></script>
<script src="pages/tasks.js"></script>
<script src="pages/sales.js"></script>
<script src="pages/tools.js"></script>
</body></html>
